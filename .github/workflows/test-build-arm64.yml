name: EditoLina Ubuntu ARM64 test package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editolina-arm64-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-arm64-deb:
    name: Ubuntu ARM64 test .deb
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential pkg-config dpkg-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libvulkan-dev libasound2-dev
      - name: Install stable Rust
        uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
      - name: Build app and CLI
        env:
          CARGO_TERM_COLOR: always
          PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
          PHOTOCRAFT_BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo build --release --locked -p photocraft -p photocraft-cli
      - name: Smoke-test ARM64 binaries
        run: |
          file target/release/photocraft target/release/photocraft-cli
          ./target/release/photocraft --version
          ./target/release/photocraft-cli --help
      - name: Assemble isolated ARM64 Debian test package
        run: |
          set -euo pipefail
          VERSION=$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && /^version =/{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          PKG="dist/editolina-test_${VERSION}~test1_arm64"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/editolina-test" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" "$PKG/usr/share/doc/editolina-test"
          install -m755 target/release/photocraft "$PKG/opt/editolina-test/photocraft"
          install -m755 target/release/photocraft-cli "$PKG/opt/editolina-test/photocraft-cli"
          cat > "$PKG/usr/bin/editolina-test" <<'LAUNCHER'
          #!/bin/sh
          exec /opt/editolina-test/photocraft "$@"
          LAUNCHER
          chmod 755 "$PKG/usr/bin/editolina-test"
          cat > "$PKG/usr/share/applications/editolina-test.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=EditoLina (test build)
          Comment=Experimental ARM64 test build of the EditoLina fork
          Exec=editolina-test %F
          Terminal=false
          Categories=Graphics;RasterGraphics;
          DESKTOP
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$PKG/usr/share/doc/editolina-test/"
          cat > "$PKG/usr/share/doc/editolina-test/TEST-BUILD.txt" <<EOF2
          Experimental EditoLina test build for Ubuntu ARM64 (aarch64).
          Based on PhotoCraft; see README.md, NOTICE and ATTRIBUTION.md for origin and credits.
          This test package installs separately under /opt/editolina-test and does not overwrite PhotoCraft.
          Launch it from the application menu as “EditoLina (test build)” or run: editolina-test
          EOF2
          cat > "$PKG/DEBIAN/control" <<EOF2
          Package: editolina-test
          Version: ${VERSION}~test1
          Section: graphics
          Priority: optional
          Architecture: arm64
          Maintainer: EditoLina test builds
          Depends: libc6 (>= 2.35), libgcc-s1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libvulkan1 | libegl1
          Recommends: mesa-vulkan-drivers, libegl-mesa0, xdg-desktop-portal
          Description: Experimental ARM64 test build of the EditoLina fork
           Separate test package, based on PhotoCraft; original credits and licenses are included.
          EOF2
          dpkg-deb --root-owner-group --build "$PKG" dist/editolina-test-ubuntu-aarch64.deb
          dpkg-deb --info dist/editolina-test-ubuntu-aarch64.deb
          sha256sum dist/editolina-test-ubuntu-aarch64.deb > dist/SHA256SUMS.txt
      - name: Upload ARM64 Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EditoLina-Ubuntu-aarch64-test-${{ github.sha }}
          path: |
            dist/editolina-test-ubuntu-aarch64.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
